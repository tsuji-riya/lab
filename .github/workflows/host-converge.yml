name: Host converge

# ホスト層の push 型 GitOps。hosts/ansible の site.yml を全ノードへ流し、
# 定義どおりに収束させる (初回構築の k3s 導入・join もここで行う)。
#
# 承認は「main へのマージ」に一本化している。Environment hosts は reviewer を
# 置かず、main 以外のブランチからは使えない (Terraform: terraform/hosts.tf)。
# シークレットと known_hosts は Terraform が生成して登録するので、人が値を
# 扱う作業は無い。
#
# 経路: GitHub-hosted runner → Cloudflare Access (サービストークン)
#       → ノード別トンネル → sshd。ホスト鍵は Terraform 生成値で厳密に検証する。

on:
  push:
    branches: [main]
    paths:
      - hosts/ansible/**
      - hosts/image/overlay/**
      - .github/workflows/host-converge.yml
  schedule:
    # 6時間ごと: ドリフトの是正と、焼いて電源を入れた新しい台の取り込み
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "対象 (Ansible の --limit。例: node7, agents)"
        required: true
        default: all

permissions:
  contents: read
  # クラスタを作り直したときに deploy を起動する (下の Sync CI kubeconfig)
  actions: write

concurrency:
  group: host-converge
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    environment: hosts
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cloudflared (版と sha256 を固定)
        env:
          CF_VERSION: "2026.11.2"
          CF_SHA256: 56f13335143ec0e22772963290683a84a04114a35ec64cbc794a4d39ff9bb8cf
        run: |
          base=https://github.com/cloudflare/cloudflared/releases/download
          curl -fsSL "$base/${CF_VERSION}/cloudflared-linux-amd64" \
            -o /tmp/cloudflared
          echo "${CF_SHA256}  /tmp/cloudflared" | sha256sum -c
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
      # ansible-core 2.22 は Python 3.13 以上が必要 (runner 標準は 3.12)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Ansible (版を固定)
        run: |
          pip install --quiet "ansible-core==2.22.*"
          ansible-galaxy collection install -r hosts/ansible/requirements.yml
      - name: Prepare SSH key and known_hosts
        env:
          HOSTS_SSH_KEY: ${{ secrets.HOSTS_SSH_KEY }}
          HOSTS_KNOWN_HOSTS: ${{ vars.HOSTS_KNOWN_HOSTS }}
        run: |
          : "${HOSTS_SSH_KEY:?Terraform が Environment hosts に登録していない}"
          : "${HOSTS_KNOWN_HOSTS:?Terraform が Environment hosts に登録していない}"
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$HOSTS_SSH_KEY" > ~/.ssh/lab_ci)
          printf '%s\n' "$HOSTS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Converge
        working-directory: hosts/ansible
        env:
          LIMIT: ${{ inputs.limit || 'all' }}
          K3S_TOKEN: ${{ secrets.K3S_TOKEN }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ANSIBLE_FORCE_COLOR: "1"
        # 台ごとに別々に流す。1回でまとめて流すと、serial: 1 の server で1台でも
        # 届かない台 (電源断・焼き直し待ち) があった時点で Ansible が残りの台
        # (新しく焼いた agent を含む) を処理せずに打ち切る。順序は inventory 順
        # (node1 → … → node7) なので、server を先に収束させる性質は変わらない
        run: |
          hosts=$(ansible all -i inventory/cloudflare.yml --list-hosts \
            --limit "${LIMIT}" | tail -n +2 | awk '{print $1}')
          failed=""
          for h in $hosts; do
            echo "::group::${h}"
            if ! ansible-playbook site.yml -i inventory/cloudflare.yml \
              --limit "$h" --diff; then
              failed="${failed} ${h}"
              # ssh は ProxyCommand の失敗理由を出さない ("Connection closed by
              # UNKNOWN port 65535" だけ) ので、トンネル経路を直接叩いて理由を出す
              ah=$(ansible-inventory -i inventory/cloudflare.yml --host "$h" \
                | jq -r .ansible_host)
              echo "--- ${h}: cloudflared access ssh --hostname ${ah} の応答"
              timeout 15 cloudflared access ssh --hostname "$ah" \
                < /dev/null 2>&1 | tail -n 5 || true
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::収束できなかった台:${failed}"
            exit 1
          fi
      # クラスタを作り直すと CA が変わり、deploy が使う K8S_* が効かなくなる
      # (k3s による admin 証明書の年次更新でも同じ)。node1 の証明書が前回と
      # 違えば K8S_* を書き換え、deploy を起動して Terraform の Secret と Flux を戻す。
      # Converge が一部の台で失敗しても node1 が生きていれば同期したいので !cancelled()
      - name: Sync CI kubeconfig
        if: ${{ !cancelled() }}
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # repo のシークレット / 変数を書く権限は Terraform 用の PAT にしかない
          SECRETS_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA256: ${{ vars.K8S_CLIENT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          # 値はログに出さない (同じ run 内で取り出した値はマスクされない)
          umask 077
          kc="$RUNNER_TEMP/k3s.yaml"
          if ! timeout 60 ssh -i ~/.ssh/lab_ci -o StrictHostKeyChecking=yes \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            riya@ssh-node1.riya.work 'sudo cat /etc/rancher/k3s/k3s.yaml' \
            > "$kc" 2>/dev/null || [ ! -s "$kc" ]; then
            echo "::warning::node1 の k3s.yaml を読めない。K8S_* の同期を飛ばす"
            exit 0
          fi
          field() { awk -v k="$1:" '$1 == k {print $2; exit}' "$kc" | base64 -d; }
          sha=$(field client-certificate-data | sha256sum | cut -d' ' -f1)
          if [ "$sha" = "${CURRENT_SHA256:-}" ]; then
            echo "K8S_* は最新"
            exit 0
          fi
          pairs="certificate-authority-data:K8S_CLUSTER_CA_CERTIFICATE
          client-certificate-data:K8S_CLIENT_CERTIFICATE
          client-key-data:K8S_CLIENT_KEY"
          # 1つでも壊れていたら何も書かない (途中まで書くと deploy が壊れる)
          for pair in $pairs; do
            case "$(field "${pair%%:*}")" in
              -----BEGIN*) ;;
              *) echo "::error::k3s.yaml の ${pair%%:*} が PEM でない"; exit 1 ;;
            esac
          done
          for pair in $pairs; do
            field "${pair%%:*}" | GH_TOKEN="$SECRETS_TOKEN" \
              gh secret set "${pair#*:}" --repo "$GITHUB_REPOSITORY"
          done
          GH_TOKEN="$SECRETS_TOKEN" gh variable set K8S_CLIENT_CERT_SHA256 \
            --repo "$GITHUB_REPOSITORY" --body "$sha"
          rm -f "$kc"
          gh workflow run deploy.yaml --repo "$GITHUB_REPOSITORY" --ref main
          echo "K8S_* を更新して deploy を起動した"
