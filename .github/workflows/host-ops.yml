name: Host ops

# ホスト OS の変更 (パッケージ更新 / 再起動) を GitHub から実行する。
#
# 実行経路: GitHub-hosted runner は LAN に届かないため、Mac 上の
# self-hosted runner (label: lab-lan) が Ansible を実行する。
# Environment host-ops の required reviewers が実行承認ゲート。
#
# 安全上の決め事:
# - この workflow は workflow_dispatch 専用。self-hosted runner を使う
#   workflow に pull_request トリガーを絶対に足さない (fork PR の毒入り
#   コードが LAN 内で実行される事故になる)
# - 再起動は playbook 側で serial: 1 + drain/uncordon/Ready 確認までやる

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "実行する操作"
        type: choice
        required: true
        options: [package-update, reboot, update-and-reboot]
      target:
        description: "対象 (canary は node7、rings は段階適用)"
        type: choice
        required: true
        options:
          - node7
          - node4
          - node5
          - node6
          - agents
          - node3
          - node2
          - node1
          - servers
          - all

permissions:
  contents: read

concurrency:
  group: host-ops-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  ops:
    runs-on: [self-hosted, lab-lan]
    environment: host-ops   # ← 実行承認 (required reviewers)
    timeout-minutes: 120
    defaults:
      run:
        working-directory: hosts/ansible
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run ops playbook
        env:
          OP: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
        run: |
          ansible-playbook ops.yml -e "op=${OP}" --limit "${TARGET}"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Host ops"
            echo "- operation: ${{ inputs.operation }}"
            echo "- target: ${{ inputs.target }}"
            echo "- actor: ${{ github.actor }}"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
