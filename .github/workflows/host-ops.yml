name: Host ops

# ホスト OS の変更 (パッケージ更新 / 再起動) を GitHub から実行する。
#
# 実行経路: GitHub-hosted runner が Cloudflare Tunnel (Access SSH)
# 経由でホストに SSH する (self-hosted runner は使わない)。承認と
# 秘密の境界は Environment host-ops に寄せてある:
# - required reviewers の承認が無いとジョブが始まらない
# - SSH 秘密鍵・kubeconfig は Environment シークレットに置き、
#   承認済みジョブにしか渡らない
# - Cloudflare 側は Access のサービストークンポリシーでこの経路を許可
#
# workflow_dispatch 専用。pull_request トリガーは足さないこと。

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "実行する操作"
        type: choice
        required: true
        options: [package-update, reboot, update-and-reboot]
      target:
        description: "対象 (canary は node7、rings は段階適用)"
        type: choice
        required: true
        options:
          - node7
          - node4
          - node5
          - node6
          - agents
          - node3
          - node2
          - node1
          - servers
          - all

permissions:
  contents: read

concurrency:
  group: host-ops-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-24.04
    environment: host-ops   # ← 実行承認ゲート
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
      - name: Prepare SSH key and kubeconfig (Environment secrets)
        env:
          LAB_ADMIN_SSH_KEY: ${{ secrets.LAB_ADMIN_SSH_KEY }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          install -d -m 700 ~/.ssh ~/.kube
          printf '%s\n' "$LAB_ADMIN_SSH_KEY" > ~/.ssh/lab_admin
          chmod 600 ~/.ssh/lab_admin
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Install Ansible and kubectl
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install -r hosts/ansible/requirements.yml
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 755 kubectl /usr/local/bin/kubectl
      - name: Run ops playbook
        working-directory: hosts/ansible
        env:
          OP: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          # Cloudflare Access のサービストークン (repo シークレット)
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ansible-playbook ops.yml -i inventory/cloudflare.yml \
            -e "op=${OP}" --limit "${TARGET}"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Host ops"
            echo "- operation: ${{ inputs.operation }}"
            echo "- target: ${{ inputs.target }}"
            echo "- actor: ${{ github.actor }}"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
