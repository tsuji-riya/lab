name: Host update check

# Dependabot が見られないホスト層の版 (k3s / Alpine) を週次でチェックし、
# 新版があればピンを書き換えた PR を自動で作る。Dependabot 本体は
# github-actions とコンテナ image を担当 (dependabot.yml 側)。
# 「指摘は PR、マージが承認、適用は Host ops / image 再ビルド」という分担。

on:
  schedule:
    # 月曜 09:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: host-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Check latest versions and bump pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          changed=""

          # k3s: 最新安定版と group_vars のピンを比較
          latest_k3s=$(gh api repos/k3s-io/k3s/releases/latest --jq .tag_name)
          current_k3s=$(grep -oP 'k3s_version:\s*"\K[^"]+' hosts/ansible/group_vars/all.yml)
          echo "k3s: current=$current_k3s latest=$latest_k3s"
          if [ "$latest_k3s" != "$current_k3s" ]; then
            sed -i "s/k3s_version: \"$current_k3s\"/k3s_version: \"$latest_k3s\"/" \
              hosts/ansible/group_vars/all.yml
            changed="$changed k3s:$current_k3s->$latest_k3s"
          fi

          # Alpine: 同じマイナー系列の最新ポイントリリースを latest-releases.yaml から取る
          minor=$(grep -oP "default: \"\K3\.\d+" .github/workflows/build-host-images.yml | head -n 1)
          current_alpine=$(grep -oP "default: \"\K3\.\d+\.\d+" .github/workflows/build-host-images.yml | head -n 1)
          latest_alpine=$(curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v${minor}/releases/x86_64/latest-releases.yaml" \
            | grep -oP 'version:\s*\K3\.\d+\.\d+' | sort -V | tail -n 1)
          echo "alpine: current=$current_alpine latest=$latest_alpine"
          if [ -n "$latest_alpine" ] && [ "$latest_alpine" != "$current_alpine" ]; then
            grep -rl "$current_alpine" .github/workflows hosts/ | while read -r f; do
              sed -i "s/$current_alpine/$latest_alpine/g" "$f"
            done
            changed="$changed alpine:$current_alpine->$latest_alpine"
          fi

          if [ -z "$changed" ]; then
            echo "更新なし" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="bot/host-updates-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "hosts: 版ピンを更新 ($changed)" \
            -m "自動チェックによる更新提案。内容を確認してマージすること。適用は Host ops (k3s は SUC と二重管理に注意) または image 再ビルドで行う。"
          git push -u origin "$branch"
          gh pr create --title "hosts: 版ピンを更新 ($changed)" \
            --body "週次チェックが新版を検出しました: $changed

          - k3s は Ansible の k3s_version、Alpine は image ビルドの既定版を書き換えています
          - マージ後に、k3s は Host ops または SUC、Alpine は image 再ビルド + 焼き直しで適用してください

          _Generated by GitHub Actions (host-update-check)_" \
            --base main --head "$branch"
