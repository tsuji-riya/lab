name: Host update check

# Dependabot が見られないホスト層の版 (k3s / Alpine) を週次でチェックし、
# (前提: Settings → Actions → General の "Allow GitHub Actions to create and
#  approve pull requests" を有効にしておくこと)
# 新版があればピンを書き換えた PR を自動で作る。Dependabot 本体は
# github-actions とコンテナ image を担当 (dependabot.yml 側)。
# 「指摘は PR、マージが承認、適用は SUC / image の自動再ビルド」という分担。

on:
  schedule:
    # 月曜 09:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write        # bot PR に lint を走らせるための workflow_dispatch

concurrency:
  group: host-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check latest versions and bump pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          changed=""
          # sed (BRE) の正規表現として安全にするため . をエスケープ
          # (BRE では + はリテラルなので触らない。\+ にすると量指定子になる)
          esc() { printf '%s' "$1" | sed 's/[.]/\\&/g'; }

          # k3s: 稼働中の版の正本は SUC の Plan (spec.version)。初回インストール用の
          # group_vars のピンも同じ値に揃えて書き換える
          latest_k3s=$(gh api repos/k3s-io/k3s/releases/latest --jq .tag_name)
          current_k3s=$(grep -oP 'k3s_version:\s*"\K[^"]+' hosts/ansible/group_vars/all.yml)
          echo "k3s: current=$current_k3s latest=$latest_k3s"
          if [ "$latest_k3s" != "$current_k3s" ]; then
            sed -i "s/$(esc "$current_k3s")/$latest_k3s/g" \
              hosts/ansible/group_vars/all.yml infrastructure/k3s-upgrade/plan.yaml
            changed="$changed k3s:$current_k3s->$latest_k3s"
          fi

          # Alpine: 同じマイナー系列の最新ポイントリリースを latest-releases.yaml から取る
          minor=$(grep -oP "default: \"\K3\.\d+" .github/workflows/build-host-images.yml | head -n 1)
          current_alpine=$(grep -oP "default: \"\K3\.\d+\.\d+" .github/workflows/build-host-images.yml | head -n 1)
          latest_alpine=$(curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v${minor}/releases/x86_64/latest-releases.yaml" \
            | grep -oP 'version:\s*\K3\.\d+\.\d+' | sort -V | tail -n 1)
          echo "alpine: current=$current_alpine latest=$latest_alpine"
          if [ -n "$latest_alpine" ] && [ "$latest_alpine" != "$current_alpine" ]; then
            grep -rlF "$current_alpine" .github/workflows hosts/ | while read -r f; do
              sed -i "s/$(esc "$current_alpine")/$latest_alpine/g" "$f"
            done
            changed="$changed alpine:$current_alpine->$latest_alpine"
          fi

          if [ -z "$changed" ]; then
            echo "更新なし" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ブランチは固定名で上書きし、PR は1本だけ保つ (毎週増やさない)
          branch="bot/host-updates"
          title="hosts: 版ピンを更新 ($changed)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$title" \
            -m "自動チェックによる更新提案。内容を確認してマージすること。k3s はマージで SUC の Plan が適用し、Alpine はマージで image が自動再ビルドされ、焼き直しで適用する。"
          git push --force -u origin "$branch"
          body="週次チェックが新版を検出しました: $changed

          - k3s は SUC の Plan (infrastructure/k3s-upgrade/plan.yaml) と Ansible の初回インストール版の両方を書き換えています。**マージすると Flux 経由で SUC が全台の k3s を上げます**
          - Alpine は image ビルドの既定版を書き換えています。マージで image と Release が自動で作られ、適用は焼き直し

          _Generated by GitHub Actions (host-update-check)_"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0 ]; then
            gh pr create --title "$title" --body "$body" --base main --head "$branch"
          else
            gh pr edit "$branch" --title "$title" --body "$body"
          fi
          # GITHUB_TOKEN で作った PR / push では pull_request workflow が発火しない。
          # workflow_dispatch は例外的に発火できるので、lint だけを PR の head で走らせて
          # 必須チェックを満たす (同名の check run が head commit に付く)
          gh workflow run build-host-images.yml --ref "$branch" -f lint_only=true
