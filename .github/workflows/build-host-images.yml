name: Build host images

# ホスト層 (hosts/) 専用。既存の deploy / image-scan は paths が
# terraform/fluxcd/infrastructure/apps に限定されており、hosts/** では発火しない。
# 逆にこの workflow も hosts/** の変更でしか発火しない。

on:
  pull_request:
    paths: ["hosts/**", ".github/workflows/build-host-images.yml"]
  workflow_dispatch:
    inputs:
      alpine_version:
        description: "Alpine version"
        required: true
        default: "3.24.4"
  push:
    tags: ["hosts-v*"]

permissions:
  contents: write          # Release 作成
  id-token: write          # provenance attestation
  attestations: write

concurrency:
  group: build-host-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Scan for secrets (push protection の二重化)
        working-directory: hosts
        run: |
          if grep -rInE 'BEGIN [A-Z ]*PRIVATE KEY|K3S_TOKEN=[^$<{]|token: [A-Za-z0-9+/=]{20,}' \
               --exclude-dir=.git --exclude-dir=out . ; then
            echo "::error::秘密らしき文字列が混入しています。hosts/SECURITY.md を確認してください"
            exit 1
          fi
          echo "secret pattern scan: clean"
      - name: Lint Ansible and shell
        run: |
          pip install --quiet ansible-core ansible-lint yamllint
          yamllint hosts/
          ansible-lint hosts/ansible/ || true   # 導入初期は警告止まり、収束後に外す
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck hosts/image/*.sh hosts/flash/*.sh

  build-x86_64:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: image-release   # ← 実行承認ゲート (required reviewers + wait timer、公開 repo では無料)
    defaults: { run: { working-directory: hosts } }
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build x86_64 image
        env:
          ALPINE_VERSION: ${{ inputs.alpine_version || '3.24.4' }}
        run: ./image/build-x86.sh
      - name: Attest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: hosts/out/*
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ${{ github.workspace }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --title "host images ${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" hosts/out/* --clobber

  build-aarch64:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm   # ネイティブ arm runner (公開 repo は 4vCPU/16GB・無料無制限)
    environment: image-release
    defaults: { run: { working-directory: hosts } }
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build Raspberry Pi image
        env:
          ALPINE_VERSION: ${{ inputs.alpine_version || '3.24.4' }}
        run: ./image/build-rpi.sh
      - name: Attest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: hosts/out/*
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ${{ github.workspace }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --title "host images ${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" hosts/out/* --clobber
      - name: Upload artifact (タグ無し実行時の受け渡し用)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-image-aarch64
          path: hosts/out/*
