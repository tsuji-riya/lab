name: terraform

on:
  pull_request:
    paths: [terraform/**, .github/workflows/terraform.yaml]
  push:
    branches: [main]
    paths: [terraform/**, .github/workflows/terraform.yaml]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_VAR_k8s_cluster_ca_certificate: ${{ secrets.K8S_CLUSTER_CA_CERTIFICATE }}
  TF_VAR_k8s_client_certificate: ${{ secrets.K8S_CLIENT_CERTIFICATE }}
  TF_VAR_k8s_client_key: ${{ secrets.K8S_CLIENT_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Install cloudflared
        working-directory: .
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Open tunnel to k3s API
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          nohup cloudflared access tcp --hostname lab-k3s-api.riya.work --url 127.0.0.1:6443 > /tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/6443) 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.R2_BUCKET }}" \
            -backend-config="endpoints={s3=\"${{ secrets.R2_ENDPOINT }}\"}"

      - run: terraform fmt -check -recursive
      - run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan

      - name: Apply Flux
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          d="$RUNNER_TEMP/kube"
          mkdir -p "$d"
          printf '%s' "$TF_VAR_k8s_cluster_ca_certificate" > "$d/ca.crt"
          printf '%s' "$TF_VAR_k8s_client_certificate" > "$d/client.crt"
          printf '%s' "$TF_VAR_k8s_client_key" > "$d/client.key"
          export KUBECONFIG="$d/config"
          kubectl config set-cluster k3s --server=https://127.0.0.1:6443 --certificate-authority="$d/ca.crt" --embed-certs=true
          kubectl config set-credentials ci --client-certificate="$d/client.crt" --client-key="$d/client.key" --embed-certs=true
          kubectl config set-context k3s --cluster=k3s --user=ci
          kubectl config use-context k3s

          kubectl apply --server-side --force-conflicts -f fluxcd/flux-system/gotk-components.yaml
          kubectl wait --for=condition=Established crd -l app.kubernetes.io/part-of=flux --timeout=120s
          kubectl -n flux-system rollout status deployment --timeout=300s
          kubectl apply --server-side --force-conflicts -k fluxcd/flux-system
          kubectl apply --server-side --force-conflicts -f fluxcd/infrastructure.yaml -f fluxcd/apps.yaml

          ts="$(date +%s)"
          kubectl -n flux-system annotate --overwrite gitrepository/flux-system reconcile.fluxcd.io/requestedAt="$ts"
          kubectl -n flux-system annotate --overwrite kustomization/flux-system kustomization/infrastructure kustomization/apps reconcile.fluxcd.io/requestedAt="$ts"
