<!doctype html>
<!-- README の status-banner.webp の原画。再生成: node .github/scripts/render-status-banner.mjs -->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 900px; height: 280px; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif;
    background: linear-gradient(135deg, #fde7f3 0%, #e8e6ff 50%, #dff4ff 100%);
    position: relative;
  }
  .emoji { font-family: "Noto Color Emoji"; }

  /* ふわふわ漂う背景のきらきら */
  .spark { position: absolute; color: #fff; font-size: 18px; animation: twinkle 3s ease-in-out infinite; text-shadow: 0 0 6px #fff; }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6) } 50% { opacity: 1; transform: scale(1.1) } }

  .title { position: absolute; left: 32px; top: 22px; }
  .title h1 { font-size: 30px; font-weight: 800; color: #5b4b8a; letter-spacing: -.5px; }
  .title p  { font-size: 14px; font-weight: 600; color: #8f7fb8; margin-top: 2px; }

  .pill {
    position: absolute; right: 32px; top: 28px;
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 999px; padding: 10px 18px;
    box-shadow: 0 4px 0 #d9cff5; font-weight: 700; color: #3f9e6e; font-size: 16px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #4fd18b; position: relative; }
  .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #4fd18b; animation: ping 1.5s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(2.6); opacity: 0 } }

  .rack { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; align-items: flex-end; gap: 22px; }
  .floor { position: absolute; left: 40px; right: 40px; bottom: 26px; height: 10px; border-radius: 99px; background: #fff8; }

  .node { display: flex; flex-direction: column; align-items: center; gap: 6px; animation: bounce 1.5s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  .name { font-size: 12px; font-weight: 700; color: #7a6aa8; }

  .body { position: relative; border-radius: 18px; border: 3px solid #5b4b8a; box-shadow: 0 5px 0 #5b4b8a33; }
  .mini { width: 92px; height: 96px; background: #fff; }
  .pi   { width: 76px; height: 78px; background: #ffd1dc; border-radius: 16px; }
  .pi::before { /* 🍓 の葉っぱ */
    content: ""; position: absolute; left: 50%; top: -12px; width: 26px; height: 12px; margin-left: -13px;
    background: #7fd48a; border: 3px solid #5b4b8a; border-radius: 12px 12px 4px 4px;
  }

  .face { position: absolute; left: 0; right: 0; top: 30%; display: flex; justify-content: center; gap: 18px; }
  .pi .face { gap: 14px; }
  .eye { width: 9px; height: 12px; background: #3d3160; border-radius: 50%; animation: blink 3s infinite; transform-origin: center; }
  @keyframes blink { 0%,44%,50%,100% { transform: scaleY(1) } 47% { transform: scaleY(.1) } }
  .mouth { position: absolute; left: 50%; top: 52%; width: 14px; height: 8px; margin-left: -7px; border: 3px solid #3d3160; border-top: none; border-radius: 0 0 12px 12px; }
  .cheek { position: absolute; top: 48%; width: 12px; height: 7px; border-radius: 50%; background: #ff9fb8; opacity: .8; }
  .cheek.l { left: 12%; } .cheek.r { right: 12%; }

  .leds { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 5px; }
  .led { width: 7px; height: 7px; border-radius: 50%; background: #4fd18b; animation: led .75s steps(1) infinite; }
  .led.b { background: #7cc4ff; }
  @keyframes led { 0% { opacity: 1 } 50% { opacity: .25 } }

  .cat { position: absolute; font-size: 34px; right: 44px; bottom: 30px; animation: sway 3s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes sway { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }
  .zz { position: absolute; right: 28px; bottom: 78px; font-size: 14px; font-weight: 800; color: #8f7fb8; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0% { transform: translate(0,6px); opacity: 0 } 40% { opacity: 1 } 100% { transform: translate(8px,-14px); opacity: 0 } }
</style>

<div class="spark" style="left:300px;top:30px">✦</div>
<div class="spark" style="left:520px;top:62px;animation-delay:-1s">✦</div>
<div class="spark" style="left:60px;top:120px;animation-delay:-2s">✦</div>
<div class="spark" style="left:840px;top:110px;animation-delay:-.5s">✦</div>
<div class="spark" style="left:420px;top:18px;animation-delay:-1.7s;font-size:12px">✦</div>

<div class="title">
  <h1><span class="emoji">🐱</span> lab cluster</h1>
  <p>k3s · 3 servers + 4 agents</p>
</div>
<div class="pill"><span class="dot"></span>all systems purring</div>

<div class="cat emoji">🐈</div>
<div class="zz">♪</div>

<div class="floor"></div>
<div class="rack" id="rack"></div>

<script>
  // 7 台を README のノード表どおりに並べる。bounce/blink をずらして順番に動いて見せる
  const rack = document.getElementById("rack");
  for (let i = 1; i <= 7; i++) {
    const pi = i >= 4;
    const d = -(i * 0.21).toFixed(2);
    rack.insertAdjacentHTML("beforeend", `
      <div class="node" style="animation-delay:${d}s">
        <div class="body ${pi ? "pi" : "mini"}">
          <div class="face"><div class="eye" style="animation-delay:${d * 2}s"></div><div class="eye" style="animation-delay:${d * 2}s"></div></div>
          <div class="cheek l"></div><div class="cheek r"></div>
          <div class="mouth"></div>
          <div class="leds"><div class="led"></div><div class="led b" style="animation-delay:${d}s"></div><div class="led" style="animation-delay:${d / 2}s"></div></div>
        </div>
        <div class="name">node${i}</div>
      </div>`);
  }
</script>
