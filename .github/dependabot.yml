version: 2
updates:
  - package-ecosystem: docker
    directory: /infrastructure/cloudflare
    schedule:
      interval: daily
    # 壊れたリリースを掴まないよう公開から 3 日待つ
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: /apps/anubis
    schedule:
      interval: daily
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: /apps/fantasy
    schedule:
      interval: daily
    cooldown:
      default-days: 3
