# server(control plane)を先に、その後 agent を 1 台ずつアップグレードする
# 版は channel 追従でなく固定する。稼働中の k3s の版の正本はここで、
# 週次の host-update-check が hosts/ansible/group_vars/all.yml (初回インストール版)
# と同時に書き換える PR を作る。マージが版上げの承認になる
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  concurrency: 1
  exclusive: true
  cordon: true
  version: v1.37.2+k3s1
  nodeSelector:
    matchExpressions:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists }
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
spec:
  concurrency: 1
  exclusive: true
  cordon: true
  version: v1.37.2+k3s1
  nodeSelector:
    matchExpressions:
    - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
  serviceAccountName: system-upgrade
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  upgrade:
    image: rancher/k3s-upgrade
