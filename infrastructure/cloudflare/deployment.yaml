apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
  namespace: cloudflare
spec:
  replicas: 2
  # 新バージョンが 30 秒生き続けるまで古い Pod を消さない
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tunnel
  template:
    metadata:
      labels:
        app: tunnel
    spec:
      containers:
        - name: tunnel
          image: cloudflare/cloudflared:2026.10.1
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
