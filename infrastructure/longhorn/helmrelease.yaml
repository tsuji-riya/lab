---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
      version: 1.13.0
  install:
    crds: Create
  interval: 24h
  upgrade:
    crds: Create
  values:
    defaultSettings:
      # 単一レプリカ(longhorn-ssd-single)のノードを drain するとき、レプリカを別ノードへ移してから進める。
      # 既定(block-if-contains-last-replica)だと alpine-os Plan の drain が止まる
      nodeDrainPolicy: block-for-eviction-if-contains-last-replica
    persistence:
      defaultDiskSelector:
        enable: true
        selector: ssd
