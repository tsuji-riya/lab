---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
      version: 1.13.0
  install:
    crds: Create
  interval: 24h
  upgrade:
    crds: Create
  values:
    defaultSettings:
      # 単一レプリカ(longhorn-ssd-single)のノードを drain するとき、レプリカを別ノードへ移してから進める。
      # 既定(block-if-contains-last-replica)だと alpine-os Plan の drain が止まる
      nodeDrainPolicy: block-for-eviction-if-contains-last-replica
      # 既定ディスクは node.longhorn.io/create-default-disk=config ラベルの台
      # (Pi の USB SSD) にだけ、node 注釈の設定 (タグ ssd) どおりに作る。
      # ラベルと注釈は hosts/ansible の k3s_node ロールが join 時に付ける。
      # Longhorn の node 作成時にだけ効く設定なので、既存ノードのディスクは変わらない
      createDefaultDiskLabeledNodes: true
    persistence:
      defaultDiskSelector:
        enable: true
        selector: ssd
