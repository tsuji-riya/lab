# CNPG の CRD は infrastructure の HelmRelease が入れるため、Cluster は別の Kustomization にして後から適用する
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 24h
  path: ./infrastructure/postgres
  prune: true
  wait: true
  timeout: 15m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
