---
# 初回構築専用。順序が意味を持つので逐次実行する:
# node1 (cluster-init) → node2/node3 (server join) → node4-7 (agent join)
- name: Initialize the cluster on node1
  hosts: node1
  roles:
    - role: k3s_node
      k3s_node_mode: server_init

- name: Fetch the node token from node1
  hosts: node1
  tasks:
    - name: Fetch k3s token from node1
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_file
      no_log: true
    # set_fact は delegate しても実行中のホスト (node1) に付く。
    # 後続の play は hostvars['node1'] から読む (メモリ上のみ、ファイルに残さない)
    - name: Stash token in memory only
      ansible.builtin.set_fact:
        k3s_token: "{{ token_file.content | b64decode | trim }}"
      no_log: true

- name: Join node2 and node3 as servers
  hosts: node2,node3
  serial: 1
  vars:
    k3s_token: "{{ hostvars['node1'].k3s_token }}"
  roles:
    - role: k3s_node
      k3s_node_mode: server_join

- name: Join agents
  hosts: agents
  vars:
    k3s_token: "{{ hostvars['node1'].k3s_token }}"
  roles:
    - role: k3s_node
      k3s_node_mode: agent
  post_tasks:
    # Longhorn は create-default-disk=config ラベル (k3s_node が付与) の台にだけ、
    # この注釈どおりの既定ディスクを作る (createDefaultDiskLabeledNodes)。
    # Longhorn より先に付けておく必要があるので bootstrap で行う (Flux はこの後)
    - name: Wait until the node is registered
      ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }}
      delegate_to: node1
      register: node_get
      until: node_get.rc == 0
      retries: 30
      delay: 10
      changed_when: false
    - name: Annotate the Longhorn default disk
      ansible.builtin.command: >-
        k3s kubectl annotate node {{ inventory_hostname }} --overwrite
        node.longhorn.io/default-disks-config='{{ [{"path": "/var/lib/longhorn",
        "allowScheduling": true, "tags": longhorn_disk_tags}] | to_json }}'
      delegate_to: node1
      changed_when: true
