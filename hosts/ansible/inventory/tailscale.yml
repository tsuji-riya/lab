---
# GitHub Actions から Tailscale (MagicDNS) 経由で接続する用。
# ホスト名は firstboot が tailscale up --hostname=nodeN で登録した短い名前。
all:
  children:
    servers:
      hosts:
        node1:
          ansible_host: node1
        node2:
          ansible_host: node2
        node3:
          ansible_host: node3
    agents:
      hosts:
        node4:
          ansible_host: node4
        node5:
          ansible_host: node5
        node6:
          ansible_host: node6
        node7:
          ansible_host: node7
