---
# LAN 内の Mac から直接つなぐ用。ホスト鍵は Terraform が生成した値を
# fetch-tokens.sh が書き出した known_hosts で検証する (焼き直しても不変)
all:
  vars:
    ansible_host: "{{ node_ips[inventory_hostname] }}"
    ansible_ssh_common_args: >-
      -o UserKnownHostsFile=~/.config/lab-hosts/known_hosts
      -o StrictHostKeyChecking=yes
  children:
    servers:
      hosts:
        node1:
        node2:
        node3:
    agents:
      hosts:
        node4:
        node5:
        node6:
        node7:
