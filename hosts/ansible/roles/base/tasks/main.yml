---
# image の overlay と同じ内容を正本 (overlay) から再配布する。
# ここに中身を書き写すと image と Ansible で二重管理になりドリフトするため
- name: Timezone
  ansible.builtin.copy:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    remote_src: true
    mode: "0644"
- name: ntpd enabled
  ansible.builtin.service:
    name: ntpd
    enabled: true
    state: started
- name: sysctl (overlay と共通)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/etc/sysctl.d/99-lab.conf"
    dest: /etc/sysctl.d/99-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl
- name: sshd is key-only (overlay と共通)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/etc/ssh/sshd_config.d/10-lab.conf"
    dest: /etc/ssh/sshd_config.d/10-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd
- name: sudoers (overlay と共通)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/etc/sudoers.d/riya"
    dest: /etc/sudoers.d/riya
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
- name: Kernel modules and rshared mount (overlay と共通)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/{{ item.path }}"
    dest: "/{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: etc/modules, mode: "0644" }
    - { path: etc/local.d/rshared.start, mode: "0755" }
- name: Services for k3s / Longhorn (全台実測で同一)
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - cgroups
    - iscsid
    - local
- name: tmpfs mounts (全台実測で同一)
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} lab-hosts tmpfs"
    block: |
      tmpfs  /tmp      tmpfs  nosuid,nodev,noatime,size=256m,mode=1777  0 0
      tmpfs  /var/log  tmpfs  nosuid,nodev,noatime,size=64m,mode=0755   0 0
- name: "Extra mounts (台固有: host_vars で定義)"
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts | default('defaults,nofail') }}"
    state: mounted
  loop: "{{ extra_mounts | default([]) }}"
- name: root password locked
  ansible.builtin.user:
    name: root
    password_lock: true
