---
# image の overlay と同じ内容を正本 (overlay) から再配布する。
# ここに中身を書き写すと image と Ansible で二重管理になりドリフトするため
- name: Timezone
  ansible.builtin.copy:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    remote_src: true
    mode: "0644"
- name: Ntpd enabled
  ansible.builtin.service:
    name: ntpd
    enabled: true
    state: started
- name: Sysctl (overlay と共通)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/etc/sysctl.d/99-lab.conf"
    dest: /etc/sysctl.d/99-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl
- name: Sshd is key-only (overlay と共通)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/etc/ssh/sshd_config.d/10-lab.conf"
    dest: /etc/ssh/sshd_config.d/10-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd
- name: Sudoers (overlay と共通)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/etc/sudoers.d/riya"
    dest: /etc/sudoers.d/riya
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
- name: Kernel modules (overlay と共通)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/{{ item.path }}"
    dest: "/{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: etc/modules, mode: "0644"}
- name: Services for k3s (全台実測で同一)
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - cgroups
    - local
# サイズは上限で、使った分だけメモリを食う。/var/log は Pod のログ
# (/var/log/pods) と k3s.log も受けるので 64m では溢れうる
- name: Tmpfs mounts
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} lab-hosts tmpfs"
    block: |
      tmpfs  /tmp      tmpfs  nosuid,nodev,noatime,size=512m,mode=1777  0 0
      tmpfs  /var/log  tmpfs  nosuid,nodev,noatime,size=256m,mode=0755  0 0
  notify: Resize tmpfs
# SSD の書き込み削減: atime 更新を止め (noatime)、タイムスタンプだけの inode 更新は
# メモリに溜める (lazytime。etcd の fdatasync でも inode を書かずに済む)。
# 既存の relatime 等は消さずに足す (noatime はカーネル側で relatime より優先)
- name: Root fs is noatime,lazytime
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\S+\s+/\s+\S+\s+)(?!\S*\b{{ item }}\b)(\S+)'
    replace: '\1\2,{{ item }}'
  loop: [noatime, lazytime]
  notify: Remount root
- name: "Extra mounts (台固有: host_vars で定義)"
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts | default('defaults,nofail') }}"
    state: mounted
  loop: "{{ extra_mounts | default([]) }}"
- name: Root password locked
  ansible.builtin.user:
    name: root
    password_lock: true
