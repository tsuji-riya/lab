---
# k3s_mode: server_init | server_join | agent (未指定なら収束のみ)
- name: Install k3s
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - \
      {{ 'server --cluster-init' if k3s_mode | default('') == 'server_init' else
         'server --server https://' + k3s_api_host + ':' + (k3s_api_port | string) + ' --token ' + k3s_token if k3s_mode | default('') == 'server_join' else
         'agent --server https://' + k3s_api_host + ':' + (k3s_api_port | string) + ' --token ' + k3s_token if k3s_mode | default('') == 'agent' else
         'server' }}
  args: { creates: /usr/local/bin/k3s }
  when: k3s_mode is defined
