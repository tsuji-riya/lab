---
# k3s の導入と join を自動判定で行う (bootstrap 専用の playbook は持たない)。
# - 既に入っている台: 何もしない (版上げは SUC の Plan が担当)
# - 新しい server: k3s が動いている server が居ればそこへ join、
#   1台も居なければ inventory 先頭 (node1) だけが cluster-init する
# - 新しい agent: 動いている server へ join (居なければ失敗し、次回再試行)
#
# token は Terraform 生成の固定値を root だけが読めるファイルに置き、--token-file で
# 渡す。引数 (--token) だと /etc/init.d/k3s (誰でも読める) に平文で残り、環境変数だと
# ansible -vvv の実行ログに出る。ファイルなら install の出力を伏せずに済む

- name: Is k3s installed here
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_node_bin

- name: Find servers already running k3s
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/token
  delegate_to: "{{ item }}"
  loop: "{{ groups['servers'] | difference([inventory_hostname]) }}"
  register: k3s_node_server_state
  ignore_unreachable: true

- name: Remember the running servers
  ansible.builtin.set_fact:
    k3s_node_members: >-
      {{ k3s_node_server_state.results
         | selectattr('stat', 'defined')
         | selectattr('stat.exists')
         | map(attribute='item') | list }}

# delegate_to は when より先に評価されるため、空リストでも安全な値にしておく
# (members[0] だと server が1台も居ない初回に when で飛ばす前に落ちる)。
# 同じ set_fact 内では直前に設定した変数を参照できないので別タスクにする
- name: Pick the server to delegate cluster operations to
  ansible.builtin.set_fact:
    k3s_node_join_host: >-
      {{ k3s_node_members | first | default(inventory_hostname) }}

- name: Install k3s on a new node
  when: not k3s_node_bin.stat.exists
  block:
    - name: Require the cluster token
      ansible.builtin.assert:
        that: k3s_token | length > 0
        fail_msg: K3S_TOKEN が渡っていない (Terraform 生成値を環境変数で渡す)

    - name: Require a running server to join (agents and node2/node3)
      ansible.builtin.assert:
        that: >-
          k3s_node_members | length > 0
          or inventory_hostname == groups['servers'][0]
        fail_msg: join 先の server が無い。先頭の server が立つと次回の収束で入る

    # 焼き直した台が同じ名前で戻ってくると、古い Node と node-password の
    # 記録が残っていて join を拒否される。この台は k3s 未導入 (=新品) なので
    # 古い記録は確実に不要
    - name: Forget a previous incarnation of this node
      ansible.builtin.shell: |
        set -eu
        k3s kubectl delete node {{ inventory_hostname }} --ignore-not-found
        k3s kubectl -n kube-system delete secret \
          {{ inventory_hostname }}.node-password.k3s --ignore-not-found
      delegate_to: "{{ k3s_node_join_host }}"
      when: k3s_node_members | length > 0
      register: k3s_node_forget
      changed_when: "'deleted' in k3s_node_forget.stdout"

    # node 名は inventory 名に固定する。既定はホスト名 (FQDN) になり、
    # SUC や kubectl での指定と食い違う
    - name: Build k3s install arguments
      ansible.builtin.set_fact:
        # 1つの式の中でリストを組み立てて join する。YAML の折り返し (>-) で
        # 式の外にテキストを並べると、字下げの深い行の後ろの改行が残り、shell では
        # そこでコマンドが切れる (--node-name 以降が k3s に渡らず、ノード名が FQDN の
        # まま。node1/node7 で発生)
        k3s_node_args: >-
          {{ ([k3s_node_kind]
              + (['--server', 'https://' + node_ips[k3s_node_join_host]
                  + ':' + (k3s_api_port | string)]
                 if k3s_node_members | length > 0 else ['--cluster-init'])
              + ['--node-name', inventory_hostname,
                 '--token-file', '/etc/rancher/k3s/cluster-token'])
             | join(' ') }}

    - name: Token directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Place the cluster token (root only)
      ansible.builtin.copy:
        content: "{{ k3s_token }}"
        dest: /etc/rancher/k3s/cluster-token
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install k3s
      block:
        - name: Run the k3s install script
          ansible.builtin.shell: >
            set -o pipefail &&
            curl -sfL https://get.k3s.io |
            INSTALL_K3S_VERSION={{ k3s_version }} sh -s - {{ k3s_node_args }}
          args:
            creates: /usr/local/bin/k3s
            executable: /bin/bash
      rescue:
        # 失敗理由は install スクリプトより k3s 本体のログにあることが多い
        - name: Show the k3s log
          ansible.builtin.command: tail -n 60 {{ k3s_node_log }}
          changed_when: false
          failed_when: false
          register: k3s_node_log_tail
        - name: Fail with the k3s log
          ansible.builtin.fail:
            msg: "{{ k3s_node_log_tail.stdout_lines | default([]) }}"

# 毎回の収束で、サービスが有効で動いていることを確かめる。install が途中で失敗した
# 台は k3s のバイナリだけ残り、次回の install (creates) が飛ばされてしまうため
- name: K3s service enabled and running
  ansible.builtin.service:
    name: "{{ k3s_node_service }}"
    enabled: true
    state: started
