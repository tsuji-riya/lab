---
# nftables の反映は nft -f で行う。サービスの restart / reload は Alpine の init
# スクリプトが flush ruleset を伴い、kube-proxy / flannel のルールまで消して通信断に
# なるため使わない (base ファイルは自テーブルだけ作り直す)
- name: Nftables.d exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"
- name: Nftables base (image と同じ内容を正本として再配布)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/overlay/etc/nftables.nft"
    dest: /etc/nftables.nft
    mode: "0644"
- name: K3s ports fragment
  ansible.builtin.copy:
    dest: /etc/nftables.d/20-k3s.nft
    mode: "0644"
    content: |
      table inet filter {
        chain input {
      {% if inventory_hostname in groups['servers'] %}
          ip saddr {{ lan_cidr }} tcp dport { 6443, 2379-2380 } accept
      {% endif %}
          ip saddr {{ lan_cidr }} tcp dport 10250 accept
          ip saddr {{ lan_cidr }} udp dport 8472 accept
        }
      }
- name: Nftables enabled at boot
  ansible.builtin.service:
    name: nftables
    enabled: true
# 毎回読み込む (変更時だけの handler にしない)。handler はプレイが後続タスクで
# 失敗すると実行されず、次回からはファイルに変更が無いので二度と呼ばれない。
# node1 で k3s の install が失敗した回に書かれた 6443 等の許可が読み込まれないまま
# 残り、node7 が join できなかった (2026-11-26)。nft -f は一括適用なので毎回でも
# 通信は途切れない。読み込み前に -c で構文を確かめる
- name: Load nftables rules (every run)
  ansible.builtin.shell: nft -c -f /etc/nftables.nft && nft -f /etc/nftables.nft
  changed_when: false
