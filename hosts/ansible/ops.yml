---
# GitHub Actions (host-ops workflow) から叩く運用 playbook。
# 変数: op = package-update | reboot | update-and-reboot
# 対象は workflow 側の --limit で絞る。再起動は必ず serial: 1 (1台ずつ)。

- name: Package update
  hosts: all
  gather_facts: false
  tasks:
    - name: apk upgrade
      command: apk upgrade --available
      register: apk_result
      changed_when: "'Upgrading' in apk_result.stdout"
      when: op in ['package-update', 'update-and-reboot']
    - name: Report upgraded packages
      debug:
        msg: "{{ apk_result.stdout_lines }}"
      when:
        - op in ['package-update', 'update-and-reboot']
        - apk_result.stdout_lines | length > 0

- name: Reboot (drain -> reboot -> uncordon -> Ready 確認)
  hosts: all
  gather_facts: false
  serial: 1
  tasks:
    - name: Drain node
      command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets --delete-emptydir-data --timeout=30m
      delegate_to: localhost
      become: false
      register: drain_result
      failed_when: false
      when: op in ['reboot', 'update-and-reboot']
    - name: Show drain result
      debug:
        msg: "{{ drain_result.stdout_lines | default([]) }}"
      when: op in ['reboot', 'update-and-reboot']
    - name: Reboot host
      reboot:
        reboot_timeout: 900
      when: op in ['reboot', 'update-and-reboot']
    - name: Uncordon node
      command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: localhost
      become: false
      when: op in ['reboot', 'update-and-reboot']
    - name: Wait for node Ready
      command: >
        kubectl wait node/{{ inventory_hostname }}
        --for=condition=Ready --timeout=300s
      delegate_to: localhost
      become: false
      when: op in ['reboot', 'update-and-reboot']
