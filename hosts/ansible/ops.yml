---
# GitHub Actions (host-ops workflow) から叩く運用 playbook。
# 変数: op = package-update | reboot | update-and-reboot
# 対象は workflow 側の --limit で絞る。更新も再起動も serial: 1 (1台ずつ) で、
# 1台でも失敗したら後続の台には進まない。
# kubectl は runner 上で動き、workflow が張る Cloudflare Access の TCP トンネル
# (127.0.0.1:6443) 経由で API に届く前提。

- name: Package update
  hosts: all
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    # -U で索引を取り直す (無いと前回取得した古い索引のまま比較して何も上がらない)
    - name: apk upgrade
      ansible.builtin.command: apk upgrade -U
      register: apk_result
      changed_when: "'Upgrading' in apk_result.stdout"
      when: op in ['package-update', 'update-and-reboot']
    - name: Report upgraded packages
      ansible.builtin.debug:
        msg: "{{ apk_result.stdout_lines }}"
      when:
        - op in ['package-update', 'update-and-reboot']
        - apk_result.stdout_lines | length > 0

- name: Reboot (drain -> reboot -> Ready 確認 -> uncordon)
  hosts: all
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    # drain の失敗は中止条件。無視して再起動すると単一レプリカの Longhorn
    # ボリューム (longhorn-ssd-single) が退避されないまま落ちる
    - name: Drain node
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets --delete-emptydir-data --timeout=30m
      delegate_to: localhost
      become: false
      changed_when: true
      when: op in ['reboot', 'update-and-reboot']
    - name: Reboot host
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: op in ['reboot', 'update-and-reboot']
    - name: Wait for node Ready
      ansible.builtin.command: >
        kubectl wait node/{{ inventory_hostname }}
        --for=condition=Ready --timeout=300s
      delegate_to: localhost
      become: false
      changed_when: false
      when: op in ['reboot', 'update-and-reboot']
    - name: Uncordon node
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: localhost
      become: false
      changed_when: true
      when: op in ['reboot', 'update-and-reboot']
