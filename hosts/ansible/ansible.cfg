[defaults]
inventory = inventory/hosts.yml
remote_user = riya
private_key_file = ~/.ssh/lab_admin
host_key_checking = True
roles_path = roles
[ssh_connection]
# タスクごとの一時ファイル転送をやめ、SSH 1往復で実行する (トンネル越しは往復が高い)。
# sudo は NOPASSWD かつ requiretty 無しなので使える
pipelining = True
[privilege_escalation]
become = True
become_method = sudo
