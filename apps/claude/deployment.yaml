# Playwright MCP 公式イメージ(Debian + Node + Chromium)に Claude Code を同居させ、`claude rc` を常駐させる。
# Playwright MCP は stdio で Claude のセッションごとに起動するので、使っていない間は Chromium が動かずメモリを食わない
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude
  namespace: claude
spec:
  replicas: 1
  # RWO の PVC を新旧 Pod で取り合わないよう、旧 Pod を止めてから新 Pod を作る
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude
  template:
    metadata:
      labels:
        app: claude
    spec:
      # node1-3(ミニ PC)。postgres と同じく etcd ロールで選ぶ(ホスト名は node1.k3s.riya.work 形式)
      nodeSelector:
        node-role.kubernetes.io/etcd: "true"
      securityContext:
        # イメージの node ユーザー
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # 手で答える場面をなくすための準備。ログイン用の Secret はここにだけ渡し、Claude のセッションからは読めないようにする
      initContainers:
        - name: setup
          image: mcr.microsoft.com/playwright/mcp:v0.0.85
          workingDir: /home/node
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              export PATH="$HOME/.local/bin:$PATH"
              # 本体は PVC に入れて再起動のたびに落とさない。npm の prefix が書き込めるので自動更新も効く
              command -v claude >/dev/null || npm install -g --prefix "$HOME/.local" --cache /tmp/npm @anthropic-ai/claude-code
              claude mcp get playwright >/dev/null 2>&1 \
                || claude mcp add -s user playwright -- node /app/cli.js --headless --browser chromium --no-sandbox --isolated
              # 無人のスケジュール実行でブラウザ操作が承認待ちで止まらないよう許可しておく。以後は自由に編集してよい
              [ -f "$HOME/.claude/settings.json" ] \
                || { mkdir -p "$HOME/.claude"; echo '{"permissions":{"allow":["mcp__playwright"]}}' > "$HOME/.claude/settings.json"; }
              # `claude rc` の "Enable Remote Control? (y/n)" と作業ディレクトリの信頼確認を、答えた状態にしておく
              mkdir -p "$HOME/work"
              node -e '
                const fs = require("fs"), f = `${process.env.HOME}/.claude.json`, dir = `${process.env.HOME}/work`;
                const c = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : {};
                c.remoteDialogSeen = true;
                c.projects = { ...c.projects, [dir]: { ...c.projects?.[dir], hasTrustDialogAccepted: true } };
                fs.writeFileSync(f, JSON.stringify(c, null, 2));
              '
              # リフレッシュトークンは一度しか使えないので、PVC にログイン情報がないときだけ使う
              if ! claude auth status 2>/dev/null | grep '"loggedIn": true' >/dev/null; then
                CLAUDE_CODE_OAUTH_REFRESH_TOKEN="$(cat /oauth/refresh-token)" CLAUDE_CODE_OAUTH_SCOPES="$(cat /oauth/scopes)" claude auth login
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
            - name: oauth
              mountPath: /oauth
              readOnly: true
      containers:
        - name: claude
          image: mcr.microsoft.com/playwright/mcp:v0.0.85
          workingDir: /home/node/work
          # 同時セッション数を絞ってメモリ上限を守る。ネットワーク断が長いと rc は終了するので、kubelet の再起動に任せる
          command: ["/home/node/.local/bin/claude", "remote-control", "--name", "lab-claude", "--spawn", "same-dir", "--capacity", "2"]
          env:
            # Bash ツールから claude を呼べるように
            - name: PATH
              value: /home/node/.local/bin:/usr/local/bin:/usr/bin:/bin
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              # Claude 本体 + セッション 2 つ + Chromium 2 つが収まる程度
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: home
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: oauth
          secret:
            secretName: claude-oauth
            defaultMode: 0440
