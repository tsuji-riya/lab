# ログイン情報・Claude Code 本体・セッション履歴を置く $HOME。
# longhorn-ssd-single は strict-local で Pi に Pod が固定されるため、ネットワーク越しに付けられる既定の longhorn を使う
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home
  namespace: claude
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 4Gi
