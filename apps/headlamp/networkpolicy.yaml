# Headlamp はログインなしで ServiceAccount の権限を使えるので、
# クラスタ内の他の Pod からは直接叩けないようにし、cloudflared からだけ受け付ける
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-only
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
