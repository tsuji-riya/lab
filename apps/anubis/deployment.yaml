apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: anubis
spec:
  # Anubis はチャレンジを Pod のメモリに持つので、複数台にすると別 Pod で答え合わせできない
  replicas: 1
  selector:
    matchLabels:
      app: anubis
  template:
    metadata:
      labels:
        app: anubis
    spec:
      # どちらのコンテナも Kubernetes API を使わないので SA トークンを渡さない
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # 前段で Anubis のチェッカーを出し、通ったリクエストだけサイト本体に渡す
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
          ports:
            - name: http
              containerPort: 8923
          env:
            - name: TARGET
              value: http://localhost:8080
            - name: POLICY_FNAME
              value: /data/cfg/botPolicy.yaml
            - name: CUSTOM_REAL_IP_HEADER
              value: Cf-Connecting-Ip
            # 合格クッキーをすぐ切らして、次にページを開いたときもチェッカーを出す
            - name: COOKIE_EXPIRATION_TIME
              value: 10s
            # 合格後に飛ばしてよい先を自分だけにする (オープンリダイレクト対策)
            - name: REDIRECT_DOMAINS
              value: anubis.riya.work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
          volumeMounts:
            - name: bot-policy
              mountPath: /data/cfg
              readOnly: true
        - name: server
          # サイト本体は tsuji-riya/anubis.riya.work でビルドしたイメージ (自作サーバー + 静的ファイル、scratch)
          image: ghcr.io/tsuji-riya/anubis.riya.work:1.0.5@sha256:b2ac39a34795625ed463d2863a6e45c872e3e0610691dfd580c30b908111bbaa
          ports:
            - name: web
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: web
      volumes:
        - name: bot-policy
          configMap:
            name: bot-policy
