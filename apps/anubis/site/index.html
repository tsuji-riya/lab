<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無限 Anubis ちゃん</title>
<link rel="icon" href="happy.webp">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fdf6ec; font-family: system-ui, sans-serif; }
  #field { position: fixed; inset: 0; }
  #field img { position: absolute; width: var(--s); translate: -50% -50%; rotate: var(--r); animation: pop .4s ease-out; pointer-events: none; user-select: none; }
  @keyframes pop { from { scale: 0; } 70% { scale: 1.15; } to { scale: 1; } }
  @media (prefers-reduced-motion: reduce) { #field img { animation: none; } }
  #count { position: fixed; top: 12px; left: 16px; padding: 6px 12px; border-radius: 999px; background: #fffc; font-weight: bold; z-index: 1; }
  footer { position: fixed; bottom: 8px; right: 16px; font-size: 12px; background: #fffc; padding: 4px 8px; border-radius: 6px; z-index: 1; }
</style>
</head>
<body>
<div id="field"></div>
<div id="count" aria-live="off">Anubis ちゃん: 0</div>
<footer>
  Mascot art by <a href="https://bsky.app/profile/celphase.bsky.social">CELPHASE</a>,
  from <a href="https://github.com/TecharoHQ/anubis">TecharoHQ/anubis</a>
  (<a href="LICENSE.txt">MIT</a>)
</footer>
<script>
  const IMAGES = ["happy.webp", "pensive.webp", "reject.webp"];
  // 古いものから消して DOM を一定数に保つ。見た目は無限に増え続ける
  const MAX = 400;
  const field = document.getElementById("field");
  const count = document.getElementById("count");
  let n = 0;

  function spawn(x = Math.random() * innerWidth, y = Math.random() * innerHeight) {
    const img = new Image();
    img.src = IMAGES[Math.floor(Math.random() * IMAGES.length)];
    img.alt = "";
    img.style.left = x + "px";
    img.style.top = y + "px";
    img.style.setProperty("--s", 80 + Math.random() * 120 + "px");
    img.style.setProperty("--r", Math.random() * 40 - 20 + "deg");
    field.append(img);
    if (field.childElementCount > MAX) field.firstElementChild.remove();
    count.textContent = "Anubis ちゃん: " + (++n).toLocaleString();
  }

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setInterval(spawn, reduced ? 1000 : 150);
  addEventListener("pointerdown", (e) => { for (let i = 0; i < 10; i++) spawn(e.clientX + (Math.random() - .5) * 120, e.clientY + (Math.random() - .5) * 120); });
</script>
</body>
</html>
