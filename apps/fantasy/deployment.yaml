apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantasy
  namespace: fantasy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fantasy
  template:
    metadata:
      labels:
        app: fantasy
    spec:
      # Kubernetes API を使わないので SA トークンを渡さない
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # サイト本体は tsuji-riya/fantasy.riya.work でビルドしたイメージ (自作サーバー + EmulatorJS、scratch)。ROM は入っていない
        - name: server
          image: ghcr.io/tsuji-riya/fantasy.riya.work:1.0.23@sha256:78200843b97de44b51bec9361b76c4254bf0cdec192a4768816cc996c23cee5e
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
