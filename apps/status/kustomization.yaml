apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- rbac.yaml
- deployment.yaml
- service.yaml
- networkpolicy.yaml
# 中身が変わると名前のハッシュが変わり、Deployment がローリングアップデートされる
configMapGenerator:
- name: status-config
  namespace: status
  files:
  - gatus.yaml
  - nginx.conf
