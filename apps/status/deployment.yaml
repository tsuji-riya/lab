apiVersion: apps/v1
kind: Deployment
metadata:
  name: status
  namespace: status
spec:
  # 結果を Pod のメモリに持つので 1 台
  replicas: 1
  selector:
    matchLabels:
      app: status
  template:
    metadata:
      labels:
        app: status
    spec:
      serviceAccountName: gatus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.38.0
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/gatus.yaml
            - name: K8S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gatus-token
                  key: token
            # 外向きの証明書に加えて、k3s API の CA も信頼する
            - name: SSL_CERT_DIR
              value: /var/run/secrets/k8s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/k8s
              readOnly: true
        # 前段で Gatus の API だけを外に出し、CORS ヘッダーを付ける
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          # /health は Gatus に転送するので、両方が動いているときだけ Ready になる
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            # nginx のキャッシュと pid 置き場
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: status-config
        - name: token
          secret:
            secretName: gatus-token
        - name: tmp
          emptyDir: {}
