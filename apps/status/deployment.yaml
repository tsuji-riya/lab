apiVersion: apps/v1
kind: Deployment
metadata:
  name: status
  namespace: status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status
  template:
    metadata:
      labels:
        app: status
    spec:
      # Kubernetes API を使わないので SA トークンを渡さない
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Gatus が gatus.yaml のエンドポイントを 1 分ごとに確認する。履歴はメモリ上だけ (再起動で消える)
        - name: gatus
          image: ghcr.io/twin/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/gatus.yaml
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
        # 公開入口。Gatus の API のうち statuses だけを CORS ヘッダ付きで通す
        - name: caddy
          image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
            - name: caddy-state
              mountPath: /data
            - name: caddy-state
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /api/v1/endpoints/statuses
              port: http
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: caddy-config
          configMap:
            name: caddy-config
        - name: caddy-state
          emptyDir: {}
