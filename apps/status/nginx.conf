# Gatus の UI は出さず、status.riya.work (GitHub Pages) が読む API だけを外に出す
server {
    listen 8080;
    server_tokens off;

    location = /api/v1/endpoints/statuses {
        limit_except GET { deny all; }
        # 中身は公開してよい死活情報だけで、クッキーも使わないので誰からでも読めてよい
        add_header Access-Control-Allow-Origin * always;
        proxy_pass http://127.0.0.1:8081;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        return 404;
    }
}
